<style>
/* Layout: canvas 3D a tutto schermo; testata in alto, scheda del corpo a destra (in basso su telefono), dock tempo+corpi in basso */
:root{
  --void:#08070c;
  --ink:#ece2cc;
  --ink-dim:#a3977f;
  --fire:#ff8a3d;
  --fire-deep:#c2401a;
  --panel:rgba(18,14,22,.8);
  --line:rgba(236,226,204,.15);
  --f-display:"GFS Didot","Didot","Bodoni 72",Georgia,serif;
  --f-ui:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--f-ui)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.head{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 16px);right:calc(env(safe-area-inset-right,0px) + 16px);display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{width:38px;height:34px;flex:none;color:var(--fire)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3vw,30px);line-height:1.05;margin:0;text-wrap:balance}
.brand p{margin:3px 0 0;font:300 12px/1.4 var(--f-ui);color:var(--ink-dim);letter-spacing:.03em;max-width:42ch}
.tools{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
button{font:400 13px/1 var(--f-ui);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button:hover:not(:disabled){border-color:rgba(255,138,61,.55)}
button[aria-pressed="true"]{border-color:var(--fire);background:rgba(194,64,26,.38)}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:2px solid var(--fire);outline-offset:2px}
.dock{position:fixed;left:0;right:0;bottom:0;padding-top:28px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;background:linear-gradient(to top,rgba(8,7,12,.94) 40%,rgba(8,7,12,0));pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:4px;border-radius:10px;padding:8px 11px}
.chip .g{font:16px/1 var(--f-display)}
.chip .i{font:400 10px/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-dim)}
.time{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;pointer-events:auto;font:300 12px/1.3 var(--f-ui);color:var(--ink-dim)}
.time label{letter-spacing:.08em;text-transform:uppercase;font-size:10px}
input[type=range]{accent-color:var(--fire);width:min(220px,38vw)}
.num{font-variant-numeric:tabular-nums;color:var(--ink)}
.hint{margin-left:auto}
.info{position:fixed;right:calc(env(safe-area-inset-right,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 84px);width:min(340px,calc(100vw - 32px));max-height:calc(100% - 270px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px 16px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.info .gr{font:400 30px/1.05 var(--f-display);color:var(--fire);margin:0 34px 4px 0}
.info h2{font:500 11px/1.2 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;margin:0}
.info .epi{font:italic 400 15px/1.3 var(--f-display);color:var(--ink-dim);margin:6px 0 12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px;padding:10px 0;border-block:1px solid var(--line)}
.facts dt{font:400 9.5px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:5px}
.facts dd{margin:0;font:400 13px/1.25 var(--f-ui);font-variant-numeric:tabular-nums}
.info p.txt{font:300 14px/1.55 var(--f-ui);margin:0;max-width:62ch}
.seg{display:flex;padding:3px;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.seg button{border:0;background:transparent;padding:7px 14px;-webkit-backdrop-filter:none;backdrop-filter:none}
.seg button[aria-pressed="true"]{background:var(--fire-deep);color:#fff4e6}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:7px 12px;margin:0 0 12px;padding:10px 0;border-block:1px solid var(--line);font:400 13px/1.25 var(--f-ui);font-variant-numeric:tabular-nums}
.cmp .hd{font:500 9.5px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);padding-bottom:2px}
.cmp .rl{font:400 9.5px/1.4 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);padding-top:2px}
.cmp .on{color:var(--fire)}
.cmp .off{color:var(--ink-dim)}
.info .note{font:300 12px/1.4 var(--f-ui);color:var(--ink-dim);margin:10px 0 0}
.chip.gone .i{text-decoration:line-through}
.chip.gone{opacity:.55}
.info .x{position:absolute;top:12px;right:12px;width:30px;height:30px;padding:0;font-size:18px;line-height:28px}
@media (max-width:640px){
  .info{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);left:calc(env(safe-area-inset-left,0px) + 16px);width:auto;max-height:38vh;padding:14px 16px}
  .info .gr{font-size:24px}
  .hint{display:none}
  button{padding:8px 12px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
(function(){
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;

/* ---------- Dati: l'ordine di Filolao (Aezio II.7.7) ---------- */
const BASE_HZ = 98; // Sol2: scala pitagorica per quinte
const BODIES = [
  {id:'fire', gr:'Ἑστία', it:'Fuoco centrale', epi:'Il focolare dell’universo', r:0, size:1.25, period:0, ratio:[1,2], note:'Sol, ottava sotto', ord:'Centro',
   text:'Al centro del cosmo non c’è la Terra ma un fuoco. Le fonti antiche lo chiamano focolare dell’universo, casa di Zeus, madre degli dèi, misura della natura. Dalla Terra non si vede mai: la parte abitata guarda sempre verso l’esterno.'},
  {id:'anti', gr:'Ἀντίχθων', it:'Antiterra', epi:'La contro-terra', r:2.6, size:.32, period:1, phase:Math.PI, color:0x4d4258, ratio:[1,1], note:'Sol · 1/1', ord:'1°',
   text:'Il decimo corpo. Gira attorno al fuoco in un giorno come la Terra, ma resta sempre nascosto. Aristotele accusò i pitagorici di averlo inventato per arrivare a dieci, il numero perfetto della tetractys; altri lo usavano per spiegare la frequenza delle eclissi di Luna. Le fonti non dicono con certezza dove si trovi: qui sta dalla parte opposta del fuoco.'},
  {id:'earth', gr:'Γῆ', it:'Terra', epi:'Un pianeta tra gli altri', r:4, size:.45, period:1, phase:0, ratio:[9,8], note:'La · 9/8', ord:'2°',
   text:'Per la prima volta la Terra lascia il centro. Fa un giro attorno al fuoco ogni giorno, sempre con l’Ellade (il punto chiaro) rivolta verso l’esterno: è questa corsa, non il moto del cielo, a produrre il giorno e la notte. Prova la vista dall’Ellade.'},
  {id:'moon', gr:'Σελήνη', it:'Luna', epi:'Abitata, secondo Filolao', r:5.6, size:.2, period:29.53, phase:1.2, color:0xcfc7b8, ratio:[81,64], note:'Si · 81/64', ord:'3°',
   text:'Un giro attorno al fuoco in circa un mese. Filolao la immaginava popolata da piante e animali più grandi e più belli dei nostri, quindici volte più forti, perché il giorno lunare dura molto più del nostro.'},
  {id:'sun', gr:'Ἥλιος', it:'Sole', epi:'Una lente di vetro', r:8, size:.85, period:365.25, phase:2.4, color:0xffe1a0, ratio:[4,3], note:'Do · 4/3', ord:'4°',
   text:'Il Sole non brilla di luce propria: è un corpo vitreo che raccoglie la luce del fuoco e la filtra fino a noi. Nel modello è anche una seconda sorgente di luce: quando l’Ellade gli sta di fronte, sulla Terra è giorno. Un giro all’anno.'},
  {id:'mercury', gr:'Στίλβων', it:'Mercurio', epi:'Lo scintillante', r:10.5, size:.17, period:365.25, phase:2.95, color:0xb9a993, ratio:[3,2], note:'Re · 3/2', ord:'5°',
   text:'Insieme a Venere accompagna il Sole: nel cosmo antico i tre corpi compiono il giro nello stesso tempo, un anno. Il nome viene dal bagliore intermittente con cui appare basso sull’orizzonte.'},
  {id:'venus', gr:'Φωσφόρος', it:'Venere', epi:'Portatrice di luce', r:12.5, size:.27, period:365.25, phase:1.85, color:0xf2e2bd, ratio:[27,16], note:'Mi · 27/16', ord:'6°',
   text:'Stella del mattino e stella della sera. La tradizione attribuisce a Pitagora (o a Parmenide) la scoperta che Fosforo ed Espero sono lo stesso astro. Anche lei gira in un anno, al passo con il Sole.'},
  {id:'mars', gr:'Πυρόεις', it:'Marte', epi:'L’infuocato', r:15.5, size:.22, period:686.98, phase:4.0, color:0xc0552f, ratio:[243,128], note:'Fa# · 243/128', ord:'7°',
   text:'Il pianeta rosso, legato al fuoco anche nel nome. Circa 687 giorni per un giro completo.'},
  {id:'jupiter', gr:'Φαέθων', it:'Giove', epi:'Lo splendente', r:19, size:.5, period:4332.6, phase:5.2, color:0xd8b98a, ratio:[2,1], note:'Sol · 2/1', ord:'8°',
   text:'Quasi dodici anni per un giro: nel modello avanza di circa un dodicesimo dell’orbita ogni anno. Con lui la scala arriva all’ottava, il rapporto 2/1.'},
  {id:'saturn', gr:'Φαίνων', it:'Saturno', epi:'Colui che appare', r:23, size:.42, period:10759, phase:.8, color:0xc9b27a, ratio:[9,4], note:'La · 9/4', ord:'9°',
   text:'Il più lento e il più lontano dei pianeti visibili a occhio nudo: quasi trent’anni per un giro. Niente anelli: nessuno li avrebbe visti per altri duemila anni.'},
  {id:'stars', gr:'Ἀπλανεῖς', it:'Stelle fisse', epi:'Le non erranti', r:30, period:0, ratio:[81,32], note:'Si · 81/32', ord:'10°',
   text:'La sfera delle stelle fisse. Qui è ferma: la rotazione del cielo notturno che vediamo dalla Terra nasce dalla corsa quotidiana della Terra attorno al fuoco. Con lei i corpi in moto diventano dieci.'},
  {id:'outer', gr:'Ὄλυμπος', it:'Fuoco esterno', epi:'Il confine del tutto', r:37, period:0, ord:'Confine', note:'—',
   text:'Filolao divide il tutto in tre regioni. L’Olimpo, il fuoco periferico, dove gli elementi sono puri. Il Kosmos, dall’Olimpo fino alla Luna, dove tutto si muove con ordine. L’Ouranos, sotto la Luna, dove le cose nascono e muoiono.'}
];
const byId = Object.fromEntries(BODIES.map(b=>[b.id,b]));

/* ---------- Dati: il Sistema solare com'è davvero ----------
   rR: distanza nella scena = 9·√UA (compressa); sR: raggio ingrandito; P: periodo siderale (giorni);
   L0: longitudine media eclittica a J2000 (gradi), per mettere i pianeti dove sono oggi. */
const REAL = {
  fire:{gone:true, ord:'non esiste', aro:'—', per:'—', sub:'non esiste',
    text:'Al centro del Sistema solare c’è il Sole, non un fuoco invisibile. Ma l’idea di Filolao conteneva un’intuizione enorme: la Terra non sta al centro e si muove. Copernico, nella dedica del De revolutionibus (1543), cita proprio Filolao tra gli antichi che avevano fatto muovere la Terra.'},
  anti:{gone:true, ord:'non esiste', aro:'—', per:'—', sub:'non esiste',
    text:'Non esiste. Le eclissi di Luna sono l’ombra della Terra stessa, e il cielo ci passa sopra perché la Terra ruota. Dietro il Sole non c’è nessun pianeta gemello: le sonde che osservano il Sistema solare da altre posizioni lo avrebbero visto da tempo.'},
  earth:{rR:9, sR:.45, P:365.256, L0:100.464, ord:'3° dal Sole', aro:'Sole', per:'365,26 giorni', sub:'1 UA dal Sole',
    text:'La Terra gira attorno al Sole in un anno e ruota su sé stessa in 23 ore e 56 minuti, con l’asse inclinato di 23,4°. Il giorno e la notte nascono da questa rotazione, non da un giro attorno a un fuoco. Filolao però aveva capito la cosa più difficile da accettare: è la Terra a muoversi, non il cielo.'},
  moon:{rR:1.2, sR:.23, P:27.3217, L0:218.316, ord:'satellite della Terra', aro:'Terra', per:'27,3 giorni', sub:'384.400 km dalla Terra',
    text:'La Luna gira attorno alla Terra, a circa 384.400 km, in 27,3 giorni (29,5 da una Luna nuova all’altra: il mese che misuravano gli antichi). Non è abitata e non ha atmosfera. Su un punto Filolao aveva ragione: il giorno lunare dura davvero circa un mese, perché la Luna mostra alla Terra sempre la stessa faccia.'},
  sun:{rR:0, sR:2.2, P:0, ord:'centro', aro:'— (è il centro)', per:'—', sub:'una stella',
    text:'Il Sole è una stella: una sfera di plasma che produce luce propria con la fusione nucleare e contiene il 99,8% della massa del Sistema solare. È lui il vero fuoco centrale. I pitagorici avevano messo un fuoco al posto giusto, e il Sole al posto sbagliato.'},
  mercury:{rR:5.6, sR:.28, P:87.969, L0:252.251, ord:'1° dal Sole', aro:'Sole', per:'88 giorni', sub:'0,39 UA',
    text:'Il pianeta più vicino al Sole: un giro in 88 giorni, non in un anno. Dalla Terra sembra accompagnare il Sole perché la sua orbita è interna alla nostra: non se ne allontana mai più di 28° circa. Per questo gli antichi gli davano lo stesso periodo del Sole.'},
  venus:{rR:7.65, sR:.44, P:224.701, L0:181.98, ord:'2° dal Sole', aro:'Sole', per:'224,7 giorni', sub:'0,72 UA',
    text:'Un giro in 225 giorni, su un’orbita interna a quella della Terra: per questo non si allontana mai più di 47° dal Sole e la vediamo solo al mattino o alla sera. Nel cosmo reale sta più vicina al Sole della Terra, non oltre. È il pianeta più caldo, sotto nubi di acido solforico.'},
  mars:{rR:11.11, sR:.33, P:686.98, L0:355.453, ord:'4° dal Sole', aro:'Sole', per:'687 giorni', sub:'1,52 UA',
    text:'Il periodo è lo stesso nei due modelli: gli astronomi antichi sapevano bene quanto ci mette Marte a tornare tra le stesse stelle, quasi due anni. Il rosso viene dall’ossido di ferro della superficie. A volte sembra tornare indietro nel cielo: è l’effetto della Terra che lo sorpassa.'},
  jupiter:{rR:20.53, sR:1.5, P:4332.59, L0:34.404, ord:'5° dal Sole', aro:'Sole', per:'11,86 anni', sub:'5,2 UA',
    text:'Il pianeta più grande: ci entrerebbero più di 1.300 Terre. Un giro in quasi 12 anni, come sapevano già gli antichi. Ha decine di lune; le quattro maggiori le scoprì Galileo nel 1610, e furono la prima prova che non tutto gira attorno alla Terra.'},
  saturn:{rR:27.79, sR:1.38, P:10759.22, L0:49.944, ord:'6° dal Sole', aro:'Sole', per:'29,46 anni', sub:'9,5 UA',
    text:'Quasi trent’anni per un giro. Gli anelli di ghiaccio e roccia li intravide Galileo nel 1610 e li descrisse Huygens nel 1655. Oltre Saturno ci sono altri due pianeti, Urano e Nettuno, invisibili a occhio nudo: nessun modello antico poteva conoscerli.'},
  stars:{ord:'a anni luce da noi', aro:'centro della Via Lattea', per:'centinaia di milioni di anni', sub:'soli lontanissimi',
    text:'Non c’è nessuna sfera: le stelle sono soli lontanissimi, sparsi a distanze diverse. La più vicina, Proxima Centauri, è a 4,2 anni luce. Se la distanza Terra–Sole fosse di un metro, Proxima starebbe a 268 km.'},
  outer:{gone:true, ord:'non esiste', aro:'—', per:'—', sub:'non esiste',
    text:'Non esiste un confine di fuoco. L’universo osservabile ha un raggio di circa 46 miliardi di anni luce e non sappiamo se abbia un limite. La luce più lontana che vediamo è la radiazione cosmica di fondo, il calore rimasto dal Big Bang: in un certo senso, un fuoco esterno c’è davvero.'}
};
BODIES.forEach(b=>{ b.real = REAL[b.id]; });
const J2000 = Date.UTC(2000,0,1,12), T0 = Date.now(), D0 = (T0 - J2000)/86400000;
const DEG = Math.PI/180, OBLIQ = 23.44*DEG, LON_HELLAS = 23.7;
const lerp = (a,b,k)=> a + (b-a)*k;
const wrapPi = x => x - TAU*Math.floor((x+Math.PI)/TAU);

/* ---------- Renderer, scena, camera ---------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08070c);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 400);
const dolly = new THREE.Group(); dolly.add(camera); scene.add(dolly);
const HOME = new THREE.Vector3(0, 13, 29);
camera.position.copy(HOME);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = .6; controls.maxDistance = 150;
controls.addEventListener('start',()=>{ zoomGoal=null; });

const ambient = new THREE.AmbientLight(0x3a2f3a, .55); scene.add(ambient);
const fireLight = new THREE.PointLight(0xffa25a, 1.7, 0); scene.add(fireLight);
const sunLight = new THREE.PointLight(0xfff0cc, 1.0, 0); scene.add(sunLight);

/* ---------- Texture procedurali ---------- */
function rng(seed){ let s = seed % 2147483647; return ()=> (s = s*16807 % 2147483647) / 2147483647; }
function tex(base, colors, n, size, seed, bands){
  const c = document.createElement('canvas'); c.width=256; c.height=128; const g=c.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,256,128); const r=rng(seed);
  if(bands){ for(let y=0;y<128;y+=3+r()*7){ g.globalAlpha=.25+r()*.35; g.fillStyle=colors[(y|0)%colors.length]; g.fillRect(0,y,256,2+r()*6);} }
  for(let i=0;i<n;i++){ g.globalAlpha=.35+r()*.4; g.fillStyle=colors[i%colors.length]; g.beginPath();
    const rx=3+r()*size; g.ellipse(r()*256, 14+r()*100, rx, rx*(.35+r()*.6), r()*3, 0, TAU); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function glowTex(stops){
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64); stops.forEach(([o,col])=>gr.addColorStop(o,col));
  g.fillStyle=gr; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c);
}

const flameMat = new THREE.ShaderMaterial({uniforms:fireUniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`attribute vec4 seed; uniform float t; uniform float uPx; uniform float uFade; varying float vLife;
    void main(){
      float life = 1.1 + seed.w*1.1;
      float age = fract(t/life + seed.x);
      float a = seed.y*6.2831853, r0 = sqrt(seed.z)*.95;
      float tongue = .75 + .45*sin(a*3. + t*2.3)*sin(a*5. - t*3.7) + .25*sin(t*6.1 + seed.y*40.);
      float h = (age*2.6 + age*age*.9) * tongue;
      float shrink = pow(1. - age, 1.35);
      vec3 p = vec3(cos(a)*r0*shrink, -.62 + h, sin(a)*r0*shrink);
      float k = age*(.15 + .25*age);
      p.x += (sin(t*3.3 + seed.y*21. + h*2.6) + .5*sin(t*7.1 + h*5.))*k;
      p.z += (cos(t*2.9 + seed.z*17. + h*2.3) + .5*cos(t*6.3 + h*4.6))*k;
      vec4 mv = modelViewMatrix*vec4(p,1.);
      gl_Position = projectionMatrix*mv;
      float size = (.55 + seed.w*.7) * (1. - .55*age);
      gl_PointSize = max(1.5*uFade, size*uFade*uPx/max(.05,-mv.z));
      vLife = age;
    }`,
  fragmentShader:`varying float vLife;
    void main(){
      vec2 uv = gl_PointCoord*2. - 1.; float d = dot(uv,uv); if(d>1.) discard;
      float soft = pow(1. - d, 1.8);
      vec3 c1 = vec3(1., .96, .78), c2 = vec3(1., .56, .14), c3 = vec3(.62, .1, .02);
      vec3 col = vLife < .28 ? mix(c1, c2, vLife/.28) : mix(c2, c3, (vLife-.28)/.72);
      float a = soft * smoothstep(0., .06, vLife) * (1. - smoothstep(.5, 1., vLife));

      float out_ = (.2 + seed.z*.9)*age*2.2;
      vec3 p = vec3(cos(a)*(sqrt(seed.z)*.8 + out_), -.6 + age*(2.4 + seed.w*3.), sin(a)*(sqrt(seed.z)*.8 + out_));
      p.x += sin(t*5. + seed.y*30.)*.12*age; p.z += cos(t*4.3 + seed.z*30.)*.12*age;

/* ---------- Armonia delle sfere ---------- */
let audio=null;
function startAudio(){
  const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  const ctx=new AC(), master=ctx.createGain(), lp=ctx.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=1500; master.gain.value=0; master.connect(lp); lp.connect(ctx.destination);
  const voices = BODIES.filter(b=>b.ratio).map(b=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type = b.id==='fire' ? 'triangle' : 'sine';
    o.frequency.value = BASE_HZ * b.ratio[0]/b.ratio[1] / (b.id==='fire'?2:1);
    g.gain.value=0; o.connect(g); g.connect(master); o.start(); return {b,g};
  });
  return {ctx, master, voices, on:false};
}
function setHarmony(on){
  if(!audio) audio=startAudio(); if(!audio) return;
  const {ctx,master}=audio; audio.on=on;
  if(on){ ctx.resume(); master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(.22, ctx.currentTime, .6); }
  else { master.gain.setTargetAtTime(0, ctx.currentTime, .3); }
  $('#harm').setAttribute('aria-pressed', on);
}

$('#lbl').addEventListener('click',e=>{ showLabels=!showLabels; e.currentTarget.setAttribute('aria-pressed',showLabels); });
$('#harm').addEventListener('click',()=> setHarmony(!(audio&&audio.on)));

/* ---------- Modalità vista ---------- */
let mode='outside', yawOff=0, pitchOff=.22;
function setMode(m){
  mode=m;
  $('#view').setAttribute('aria-pressed', m==='earth');
  $('#view').textContent = m==='earth' ? 'Vista dall’esterno' : 'Vista dall’Ellade';
  hellas.visible = m!=='earth';
  if(renderer.xr.isPresenting){ placeXR(); return; }
  if(m==='earth'){
    controls.enabled=false; camera.fov=72; yawOff=0; pitchOff=.22;
    $('#hint').textContent='Sei in Grecia e guardi a sud, verso l’eclittica · trascina per guardarti intorno';
    if(selected){ selected=null; select(null); }
  } else {
    controls.enabled=true; camera.fov=55; camera.up.set(0,1,0);
    camera.position.copy(HOME).multiplyScalar(cosmo==='real'?1.5:1); controls.target.set(0,0,0); controls.update();
    $('#hint').textContent='Trascina per ruotare · rotella o pizzico per lo zoom · tocca un corpo';
  }
  camera.updateProjectionMatrix();
}
$('#view').addEventListener('click',()=> setMode(mode==='earth'?'outside':'earth'));

/* ---------- Puntatore: selezione e sguardo ---------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let down=null;
canvas.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY}; });
canvas.addEventListener('pointermove',e=>{
  if(!down || mode!=='earth') return;
  yawOff -= (e.clientX-down.lx)*.004; pitchOff = Math.max(-.6, Math.min(1.45, pitchOff + (e.clientY-down.ly)*.004));
  down.lx=e.clientX; down.ly=e.clientY;
});
window.addEventListener('pointerup',e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down.x, e.clientY-down.y); down=null;
  if(moved>6 || mode==='earth' || e.target!==canvas) return;
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(pickables,false).find(h=> vis(h.object.userData.body)>.5);
  if(hit) select(hit.object.userData.body);
});

/* ---------- WebXR ---------- */
const vrBtn=$('#vr');
function noVR(){ vrBtn.disabled=true; vrBtn.textContent='VR non disponibile qui'; vrBtn.title='Apri la versione standalone dal browser del visore, servita in HTTPS'; }
if(navigator.xr && navigator.xr.isSessionSupported){
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{ if(ok){ vrBtn.disabled=false; vrBtn.textContent='Entra in VR'; } else noVR(); }).catch(noVR);
} else noVR();
let savedCam=null;
vrBtn.addEventListener('click', async ()=>{
  if(renderer.xr.isPresenting){ renderer.xr.getSession().end(); return; }
  try{
    const s = await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});
    savedCam = {pos:camera.position.clone(), target:controls.target.clone()};
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(s);
    s.addEventListener('select', ()=> setMode(mode==='earth'?'outside':'earth'));
    s.addEventListener('squeeze', ()=> setCosmo(cosmo==='real'?'filolao':'real'));
    s.addEventListener('end', ()=>{
      dolly.position.set(0,0,0); dolly.quaternion.identity(); dolly.scale.setScalar(1);
      vrBtn.textContent='Entra in VR';
      if(savedCam){ camera.position.copy(savedCam.pos); controls.target.copy(savedCam.target); }
      setMode(mode);
    });
    vrBtn.textContent='Esci dalla VR';
    placeXR();
  }catch(err){ vrBtn.textContent='VR non avviata'; vrBtn.title=String(err && err.message || err); }
});
function placeXR(){
  if(mode==='outside'){ dolly.scale.setScalar(1); dolly.quaternion.identity(); dolly.position.set(0,-.9,15); }
  // la vista dalla Terra viene aggiornata a ogni fotogramma
}

/* ---------- Ciclo principale ---------- */
const V = ()=>new THREE.Vector3();
const tmp=V(), tmp2=V(), tmp3=V(), n=V(), u=V(), f=V(), right=V(), camW=V(), ORIGIN=V(), axisW=V(), basis=new THREE.Matrix4(), qT=new THREE.Quaternion();
const Y=new THREE.Vector3(0,1,0);
let last=performance.now();
function angleOf(b){ return b.period ? TAU*(days/b.period) + (b.phase||0) : 0; }
function effSpeed(){ return (renderer.xr.isPresenting && mode==='earth') ? Math.min(speed,.01) : speed; }

function frame(){
  const now=performance.now(), dt=Math.min(.1,(now-last)/1000); last=now;
  if(playing) days += dt*effSpeed();
  fireUniforms.t.value = outerUniforms.t.value = now/1000; updateFire(now/1000);

  // passaggio Filolao ↔ oggi (2,4 s)
  mp = Math.max(0, Math.min(1, mp + (cosmo==='real'?1:-1)*dt/(reduce?.6:2.4)));
  K = mp*mp*(3-2*mp);
  const dJ = D0 + days;                                  // giorni da J2000: oggi + tempo simulato
  const earthR = REAL.earth, aE = (earthR.L0 + 360*dJ/earthR.P)*DEG;
  const earthRealPos = tmp3.set(Math.cos(aE)*earthR.rR, 0, -Math.sin(aE)*earthR.rR);
  BODIES.forEach(b=>{
    if(!b.period || !b.mesh) return;
    const a=angleOf(b), R=b.real;
    let x=Math.cos(a)*b.r, z=Math.sin(a)*b.r, rx=x, rz=z;
    if(R.gone){ rx=x; rz=z; }
    else if(b.id==='moon'){ const m=(R.L0 + 360*dJ/R.P)*DEG; rx=earthRealPos.x+Math.cos(m)*R.rR; rz=earthRealPos.z-Math.sin(m)*R.rR; }
    else if(R.P){ const l=(R.L0 + 360*dJ/R.P)*DEG; rx=Math.cos(l)*R.rR; rz=-Math.sin(l)*R.rR; }
    else { rx=0; rz=0; }                                 // il Sole va al centro
    b.mesh.position.set(lerp(x,rx,K), 0, lerp(z,rz,K));
    const sc = R.sR ? lerp(1, R.sR/b.size, K) : (R.gone ? Math.max(.001,1-K) : 1);
    b.mesh.scale.setScalar(sc); b.mesh.visible = sc>.002;
    if(b.id==='earth'){
      // Filolao: l'Ellade guarda sempre fuori. Oggi: rotazione siderale vera, asse inclinato di 23,4°
      const fil = -a, lst = (280.46061837 + 360.98564736629*dJ + LON_HELLAS)*DEG;
      earthSpin.rotation.y = lerp(fil, fil + wrapPi(lst - fil), K);
      earthTilt.rotation.x = -OBLIQ*K;
    }
    else if(b.id==='anti') b.mesh.rotation.y = -a;
    else b.mesh.rotation.y = -a*.3;
    // orbite
    if(b.orbit){
      const rr = R.gone ? b.r : (b.id==='moon' ? R.rR : (R.rR||0));
      b.orbit.scale.setScalar(Math.max(.001, lerp(b.r, rr, K)));
      if(b.id==='moon') b.orbit.position.set(earthRealPos.x*K, 0, earthRealPos.z*K); 
      const fade = (b.id==='sun') ? 1-K : vis(b);
      b.orbit.material.opacity = (selected===b ? .55 : .13) * fade;
      b.orbit.visible = fade>.01;
    }
  });
  const sun=byId.sun, sunP = sun.mesh.position; sunLight.position.copy(sunP);
  sunLight.intensity = lerp(1.0, 2.4, K);
  sun.mesh.material.emissiveIntensity = lerp(.85, 1.5, K); sun.mesh.material.opacity = lerp(.92, 1, K);
  sun.glow.scale.setScalar(lerp(5, 4.2, K));
  beamGeo.attributes.position.setXYZ(1, sunP.x, sunP.y, sunP.z); beamGeo.attributes.position.needsUpdate=true;
  beam.material.opacity = .22*(1-K); beam.visible = K<.99;
  fireUniforms.uFade.value = 1-K; hearth.scale.setScalar(Math.max(.001,1-K)); hearth.visible = K<.995;
  fireLight.intensity *= (1-K); glow.material.opacity *= (1-K); glow.visible = K<.995;
  outerUniforms.uFade.value = 1-K; outerMesh.visible = K<.995;
  starsGroup.scale.setScalar(lerp(1, 3.6, K));
  ambient.intensity = lerp(.55, .3, K);
  if(saturnRings){ ringMat.uniforms.uK.value = K; saturnRings.visible = K>.01; }

  // Geometria della vista dall'Ellade
  const earth=byId.earth.mesh; earth.updateMatrixWorld(true);
  hellas.getWorldPosition(tmp); n.copy(tmp).sub(earth.position).normalize();
  earthTilt.getWorldQuaternion(qT); axisW.set(0,1,0).applyQuaternion(qT);
  f.copy(axisW).negate().addScaledVector(n, axisW.dot(n)).normalize(); // verso l'equatore: si guarda a sud

  if(renderer.xr.isPresenting){
    if(mode==='earth'){
      const s=.02; dolly.scale.setScalar(s);
      dolly.position.copy(earth.position).addScaledVector(n, byId.earth.size);
      right.crossVectors(n, tmp2.copy(f).negate()); // x = y × z
      basis.makeBasis(right, n, tmp2); dolly.quaternion.setFromRotationMatrix(basis);
    } else {
      const src = renderer.xr.getSession().inputSources;
      for(const is of src){ const gp=is.gamepad; if(!gp||gp.axes.length<4) continue;
        const ax=gp.axes[2], ay=gp.axes[3]; if(Math.abs(ax)<.15 && Math.abs(ay)<.15) continue;
        renderer.xr.getCamera(camera).getWorldDirection(tmp2); tmp2.y=0; tmp2.normalize();
        right.crossVectors(tmp2, Y);
        dolly.position.addScaledVector(tmp2, -ay*3*dt).addScaledVector(right, ax*3*dt);
      }
    }
  } else if(mode==='earth'){
    camera.position.copy(earth.position).addScaledVector(n, sizeOf(byId.earth)+.012);
    camera.up.copy(n);
    tmp2.copy(f).applyAxisAngle(n, yawOff); right.crossVectors(tmp2, n).normalize();
    tmp2.applyAxisAngle(right, pitchOff);
    camera.lookAt(tmp.copy(camera.position).add(tmp2));
  } else {
    const moving = selected && selected.mesh && selected.id!=='stars' && selected.id!=='outer';
    const goal = moving ? selected.mesh.position : ORIGIN;
    tmp.copy(goal).sub(controls.target);
    const k = lockOn ? 1 : 1-Math.exp(-dt*5);
    tmp.multiplyScalar(k); controls.target.add(tmp); camera.position.add(tmp);
    if(!lockOn && controls.target.distanceTo(goal)<.03) lockOn=true;
    if(selected){
      tmp2.copy(camera.position).sub(controls.target); const d=tmp2.length(), want=focusDist(selected);
      if(Math.abs(d-want)>.02 && !selected._arrived){ tmp2.setLength(d+(want-d)*(1-Math.exp(-dt*3))); camera.position.copy(controls.target).add(tmp2); }
      else selected._arrived=true;
    }
    if(zoomGoal && !selected){
      tmp2.copy(camera.position).sub(controls.target); const d=tmp2.length();
      if(Math.abs(d-zoomGoal)<.05) zoomGoal=null;
      else { tmp2.setLength(d+(zoomGoal-d)*(1-Math.exp(-dt*2.2))); camera.position.copy(controls.target).add(tmp2); }
    }
    controls.update();
  }

  // Etichette
  (renderer.xr.isPresenting ? renderer.xr.getCamera(camera) : camera).getWorldPosition(camW);
  labels.forEach(s=>{
    const b=s.userData.body, v=vis(b); s.visible=showLabels && v>.02; if(!s.visible) return;
    const want = K>.5 ? s.userData.tR : s.userData.tF; if(s.material.map!==want){ s.material.map=want; s.material.needsUpdate=true; }
    let p;
    if(FIXED_LABEL[b.id]) p=tmp3.copy(FIXED_LABEL[b.id]).multiplyScalar(b.id==='stars'?starsGroup.scale.x:1);
    else p=b.mesh ? b.mesh.position : ORIGIN;
    const d=camW.distanceTo(p), h=Math.max(.05, d*.03);
    s.scale.set(h*3.2, h, 1);
    s.position.copy(p); if(!FIXED_LABEL[b.id]) s.position.y += (b.id==='fire'?(b.labelLift*(1-K)):sizeOf(b)) + h*.55;
    s.material.opacity = (selected && selected!==b ? .45 : .92) * v * Math.min(1, Math.abs(2*K-1)*2.5+.0);
  });

  // Armonia: ogni sfera respira al ritmo della propria orbita
  if(audio && audio.on){
    const t=audio.ctx.currentTime;
    audio.voices.forEach(({b,g})=>{
      const a=angleOf(b), base = b.id==='fire'?.05:.035;
      let v = base*(.55+.45*Math.sin(a))*vis(b); if(selected===b) v*=3;
      g.gain.setTargetAtTime(v, t, .12);
    });
  }
  renderer.render(scene,camera);
}
const clockEl=$('#clock');
const dateFmt = new Intl.DateTimeFormat('it-IT',{day:'numeric', month:'short', year:'numeric'});
setInterval(()=>{ clockEl.textContent = `${dateFmt.format(new Date(T0 + days*86400000))} · giorno ${fmt(Math.floor(days),0)}`; },200);
renderer.setAnimationLoop(frame);

addEventListener('resize',()=>{ if(renderer.xr.isPresenting) return; camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
})();
</script>

</body></html>
